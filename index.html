<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="金魚貼文">

<title>金魚 IG&amp;Threads 貼文產生程式</title>
<style>
:root{
  --bg:#FAF9F6;--card:#FFFFFF;--soft:#F3F1EC;--line:#E3DFD6;--line2:#D2CCC0;
  --gold:#E0980A;--goldbg:#F5B430;--coral:#E0553A;--teal:#2E9C8A;--violet:#7C63D8;
  --lime:#6DA023;--sky:#2F86C4;--rose:#D25A8C;
  --txt:#1F1D1A;--mute:#77706A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;background:var(--bg);color:var(--txt);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  padding-bottom:92px;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.head{padding:22px 0 14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.logo{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.logo span{color:var(--gold)}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(31,29,26,.04)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700}
label.fl{display:block;font-size:12px;color:var(--mute);margin:12px 0 6px;letter-spacing:.04em}
label.fl:first-child{margin-top:0}
input.fi,textarea.fi{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:10px;
  color:var(--txt);padding:11px 12px;font-size:16px;font-family:inherit;line-height:1.55}
textarea.fi{resize:vertical}
input.fi:focus,textarea.fi:focus{outline:2px solid var(--goldbg);outline-offset:1px;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;
  background:var(--goldbg);color:#2B1D00;border:none;border-radius:11px;padding:14px;
  font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line2)}
.btn.sm{width:auto;padding:9px 15px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--card);
  color:var(--mute);font-size:13px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--goldbg);color:#2B1D00;border-color:var(--goldbg);font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:68px;height:68px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
  border:none;background:rgba(255,255,255,.9);color:var(--txt);font-size:12px;cursor:pointer;line-height:1;
  box-shadow:0 1px 3px rgba(0,0,0,.2)}
.stamp{width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#FFFFFF}
.t-gold{background:var(--gold)}.t-teal{background:var(--teal)}.t-coral{background:var(--coral)}
.t-violet{background:var(--violet)}.t-lime{background:var(--lime)}.t-sky{background:var(--sky)}.t-rose{background:var(--rose)}
.spine{border-left:2px solid var(--line);margin-left:14px;padding-left:18px}
.speaker{display:flex;align-items:center;gap:10px;margin:0 0 8px -33px}
.speaker b{font-size:14px}
.say{font-size:15px;line-height:1.85;margin:0 0 18px;white-space:pre-wrap;word-break:break-word}
.fact,.guess{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:6px}
.fact{background:var(--goldbg);color:#2B1D00}
.guess{border:1px dashed var(--mute);color:var(--mute)}
.post{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:14px;
  font-size:15px;line-height:1.95;white-space:pre-wrap;word-break:break-word}
.meta{font-size:12.5px;color:var(--mute);line-height:1.7}
.slot{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;background:var(--soft)}
.slot b{font-size:17px;color:var(--gold)}
.err{background:#FDECE8;border:1px solid #E9A897;color:#8A2B16;border-radius:10px;
  padding:11px 13px;font-size:13.5px;line-height:1.6;margin-bottom:12px}
.ok{background:#EAF5E2;border:1px solid #A9CE85;color:#3B5C1B;border-radius:10px;
  padding:11px 13px;font-size:13.5px;line-height:1.6;margin-bottom:12px}
.empty{color:var(--mute);font-size:13.5px;line-height:1.75;text-align:center;padding:22px 8px}
.rec{border-bottom:1px solid var(--line);padding:12px 0}
.rec:last-child{border-bottom:none}
.rec-t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rec-t b{font-size:14px;line-height:1.5}
.rec-x{background:none;border:none;color:var(--mute);cursor:pointer;font-size:12px;padding:2px 4px}
.mtag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:6px;
  padding:3px 8px;font-size:12.5px;margin:6px 6px 0 0}
.mtag b{color:var(--gold)}
.load{display:flex;align-items:center;gap:9px;color:var(--mute);font-size:13.5px;padding:8px 0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:bl 1s infinite}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20;
  box-shadow:0 -1px 6px rgba(31,29,26,.05)}
nav button{flex:1;background:none;border:none;color:var(--mute);font-family:inherit;font-size:11px;
  padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button.on{color:var(--gold);font-weight:700}
nav em{font-style:normal;font-size:19px;line-height:1}
</style>

<script>

結尾明確叫大家去聽完整版，不要只寫敬請期待。
情緒放到最滿，這是慶祝，不是流程紀錄。` },
  { key:"tip", label:"小知識", goal:"沒題材時的常備彈藥。用專業換收藏和留言，不需要任何新作品。",
    guide:`講一件錄音或影像的實務知識，對象是完全不懂的一般人。
不要套用「完成！！」的標準結構。開頭先丟出那個大家可能誤會或沒想過的點，再解釋。
用比喻讓外行人聽懂，不要堆術語；真的要用術語就順手解釋一句。
只講你確定的事，不要編數據、不要編來源、不要講絕對化的說法。

長度可以比一般貼文稍長，但仍然是口語，不是教學文章。` },
  { key:"voice", label:"客人的話", goal:"讓客人自己轉發。",
    guide:`客人說的話是主體，完整呈現，不要改寫成老闆的口吻。
老闆自己的回應只佔最後兩三句，語氣是感謝，不要蓋過客人。
不推銷服務，結尾收得低調，CTA 可以省略。` }
];

const ROLES = [
  { key:"insight", ch:"洞", name:"洞察官", tint:"gold", job:"從已知數據裡找出模式與異常，指出哪些是真訊號、哪些只是巧合。不做創意發想。" },
  { key:"strategy", ch:"策", name:"策略官", tint:"teal", job:"看定位與取捨：該被記住的是什麼，資源押在哪，什麼該砍掉。講清楚機會成本。" },
  { key:"content", ch:"文", name:"內容官", tint:"coral", job:"想題材、鉤子與系列企劃。給具體到明天就能拍的點子。" },
  { key:"sales", ch:"業", name:"業務官", tint:"sky", job:"看詢問到成交這條路：貼文有沒有下一步、報價怎麼開口、怎麼把私訊變訂單。給可以照著講的話術。" },
  { key:"risk", ch:"險", name:"風控官", tint:"violet", job:"抓風險：音樂與影像版權、平台規則、誇大承諾、客訴引信。直接指出哪一句會惹麻煩。" },
  { key:"new", ch:"新", name:"創新官", tint:"rose", job:"提還沒人在做的格式、拍法與方案組合。要說清楚為什麼現在做得起來。" },
  { key:"ops", ch:"行", name:"執行官", tint:"lime", job:"把方向拆成本週做得完的步驟，標出誰做、要多久、先後順序。不談願景。" }
];
const DEFAULT_ROLE_KEYS = ["insight","strategy","content","sales","ops"];

/* ==================== 工具 ==================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const S = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};

async function callOnce(system, messages, maxTokens){
  const res = await fetch(WORKER_URL, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ model: MODEL, max_tokens: maxTokens || 1600, system, messages })
  });
  const data = await res.json().catch(() => ({}));
  if (data.error) throw new Error(data.error.message || "API 回傳錯誤");
  if (!res.ok) throw new Error("HTTP " + res.status);
  const text = (data.content || []).map(b => b.type === "text" ? b.text : "").filter(Boolean).join("\n").trim();
  if (!text) throw new Error("模型沒有回傳內容");
  return text;
}

async function callClaude(system, messages, maxTokens, tries){
  tries = tries || 2;
  let last;
  for (let i = 0; i < tries; i++){
    try { return await callOnce(system, messages, maxTokens); }
    catch(e){ last = e; if (i < tries - 1) await new Promise(r => setTimeout(r, 2500)); }
  }
  throw last;
}

function parseJSON(t){
  const c = String(t).replace(/```json/gi,"").replace(/```/g,"").trim();
  const s = c.indexOf("{"), e = c.lastIndexOf("}");
  return JSON.parse(s >= 0 && e > s ? c.slice(s, e+1) : c);
}
function safeJSON(t, fb){ try { return parseJSON(t); } catch(e){ return fb; } }

function tagged(text){
  return String(text || "").split(/(【事實】|【推測】)/g).map(p =>
    p === "【事實】" ? '<span class="fact">事實</span>' :
    p === "【推測】" ? '<span class="guess">推測</span>' : esc(p)
  ).join("");
}

function copyText(t){
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
}

function fileToBlock(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error("圖片讀取失敗"));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("圖片格式不支援"));
      img.onload = () => {
        const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL("image/jpeg", quality);
        resolve({ block:{ type:"image", source:{ type:"base64", media_type:"image/jpeg", data:url.split(",")[1] } }, preview:url });
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function num(v){ const n = Number(String(v == null ? "" : v).replace(/[^0-9.]/g,"")); return isNaN(n) ? 0 : n; }
function rowLine(r){
  if (r.metrics) return "・" + (r.title||"") + "｜" + (r.metrics||[]).map(x => x.label + " " + x.value).join("、");
  return "・" + (r.title||"未命名") +
    (r.platform || r.format ? "｜" + [r.platform, r.format].filter(Boolean).join(" ") : "") +
    (r.when ? "｜" + r.when : "") +
    "｜瀏覽 " + num(r.views) + (r.reach ? "｜觸及 " + num(r.reach) : "") +
    "｜讚 " + num(r.likes) + "｜留言 " + num(r.comments) + "｜分享 " + num(r.shares) +
    (r.saves ? "｜儲存 " + num(r.saves) : "") +
    (r.profileVisits !== undefined
      ? "｜個人檔案點擊 " + num(r.profileVisits) +
        (num(r.reach) ? "（佔觸及 " + (num(r.profileVisits) / num(r.reach) * 100).toFixed(1) + "%）" : "")
      : "") +
    (r.newFollowers !== undefined ? "｜新增粉絲 " + num(r.newFollowers) : "") +
    (r.fan !== undefined ? "｜非粉絲佔 " + (r.nonfan||0) + "%" : "") +
    (r.avgWatch ? "｜平均觀看 " + r.avgWatch : "") +
    (Array.isArray(r.src) && r.src.length ? "｜主要來源 " + r.src[0].n + " " + r.src[0].p + "%" : "");
}
function isRich(r){
  return r.caption || r.fan !== undefined || r.src || r.rShare !== undefined ||
         r.avgWatch || r.profileVisits !== undefined || r.platform;
}

function fullBlock(r){
  const L = [];
  const push = (label, val) => { if (val !== undefined && val !== null && val !== "") L.push(label + "：" + val); };
  push("標題", r.title);
  push("平台", r.platform); push("形式", r.format);
  push("發布時間", r.when);
  push("共同協作", r.collab); push("跨平台發佈", r.cross);
  push("觀看次數", r.views !== undefined ? num(r.views) : undefined);
  push("觀看拆分", (r.viewsIG !== undefined || r.viewsFB !== undefined)
    ? "IG " + num(r.viewsIG) + "／FB " + num(r.viewsFB) : undefined);
  push("觸及帳號數", r.reach !== undefined ? num(r.reach) : undefined);
  push("個人檔案點擊", r.profileVisits !== undefined ? num(r.profileVisits) : undefined);
  if (r.profileVisits !== undefined && num(r.reach))
    push("個人檔案點擊率", (num(r.profileVisits)/num(r.reach)*100).toFixed(1) + "%");
  push("新增粉絲", r.newFollowers !== undefined ? num(r.newFollowers) : undefined);
  push("讚", r.likes !== undefined ? num(r.likes) : undefined);
  push("讚拆分", (r.likesIG !== undefined || r.likesFB !== undefined)
    ? "IG " + num(r.likesIG) + "／FB " + num(r.likesFB) : undefined);
  push("留言", r.comments !== undefined ? num(r.comments) : undefined);
  push("留言拆分", (r.commentsIG !== undefined || r.commentsFB !== undefined)
    ? "IG " + num(r.commentsIG) + "／FB " + num(r.commentsFB) : undefined);
  push("轉發", r.reposts !== undefined ? num(r.reposts) : undefined);
  push("分享", r.shares !== undefined ? num(r.shares) : undefined);
  push("儲存", r.saves !== undefined ? num(r.saves) : undefined);
  push("分享率", r.rShare !== undefined ? r.rShare + "%" : undefined);
  push("按讚率", r.rLike !== undefined ? r.rLike + "%" : undefined);
  push("儲存率", r.rSave !== undefined ? r.rSave + "%" : undefined);
  push("轉發率", r.rRepost !== undefined ? r.rRepost + "%" : undefined);
  push("留言率", r.rComment !== undefined ? r.rComment + "%" : undefined);
  push("率標高低", r.rateNote);
  push("平均觀看時間", r.avgWatch); push("影片全長", r.vidLen); push("留存曲線", r.retention);
  push("觀看來源", Array.isArray(r.src) ? r.src.map(x => x.n + " " + x.p + "%").join("、") : undefined);
  push("粉絲比例", r.fan !== undefined ? "粉絲 " + r.fan + "%／非粉絲 " + (r.nonfan||0) + "%" : undefined);
  push("年齡分佈", Array.isArray(r.ages) ? r.ages.map(x => x.n + " " + x.p + "%").join("、") : undefined);
  push("性別分佈", r.male !== undefined ? "男 " + r.male + "%／女 " + (r.female||0) + "%" : undefined);
  push("地區分佈", Array.isArray(r.geo) ? r.geo.map(x => x.n + " " + x.p + "%").join("、") : undefined);
  push("輪播各張讚數", Array.isArray(r.carousel) ? r.carousel.map(x => x.n + " " + x.l).join("、") : undefined);
  push("與一般貼文相比", r.vsAvg);
  push("hashtag", Array.isArray(r.tags) && r.tags.length ? r.tags.map(t => "#" + t).join(" ") : undefined);
  if (r.metrics) push("其他數字", r.metrics.map(m => m.label + " " + m.value).join("、"));
  if (r.caption) L.push("完整文案：\n" + r.caption);
  return L.join("\n");
}

function pickTopBottom(arr, n){
  if (arr.length <= n) return { top: arr, bottom: [], skipped: 0 };
  const half = Math.ceil(n / 2);
  const top = arr.slice(0, half);
  const bottom = arr.slice(-(n - half));
  return { top: top, bottom: bottom, skipped: arr.length - top.length - bottom.length };
}

function digest(list, cap){
  if (!list.length) return "（目前沒有任何已存的成效數據）";
  const N = Math.max(4, Number(cap) || 25);
  const PLATS = ["IG", "FB", "Threads"];
  const sorted = list.slice().sort((a,b) => num(b.views) - num(a.views));

  const richBy = {}, thinBy = {};
  sorted.forEach(r => {
    const pf = PLATS.indexOf(r.platform) >= 0 ? r.platform : "IG";
    const bucket = isRich(r) ? richBy : thinBy;
    (bucket[pf] = bucket[pf] || []).push(r);
  });

  const present = PLATS.filter(pf => (richBy[pf] && richBy[pf].length) || (thinBy[pf] && thinBy[pf].length));
  const perRich = Math.max(4, Math.floor(N / Math.max(1, present.length)));
  const perThin = Math.max(10, Math.floor(40 / Math.max(1, present.length)));

  let out = "共 " + list.length + " 筆成效資料，涵蓋平台：" + present.join("、") + "。\n" +
    "以下依平台分開列出。每個平台各取表現最好與最差的幾篇對照，中間的沒列出來。";

  present.forEach(pf => {
    out += "\n\n████ " + pf + " ████";
    const rich = richBy[pf] || [];
    if (rich.length){
      const g = pickTopBottom(rich, perRich);
      out += "\n\n【" + pf + "｜單則深度資料，共 " + rich.length + " 篇】";
      out += "\n\n── " + pf + " 表現最好的 " + g.top.length + " 篇 ──\n" +
        g.top.map((r,i) => "《" + pf + " 好 " + (i+1) + "》\n" + fullBlock(r)).join("\n\n");
      if (g.bottom.length)
        out += "\n\n── " + pf + " 表現最差的 " + g.bottom.length + " 篇（拿來跟上面對照找原因）──\n" +
          g.bottom.map((r,i) => "《" + pf + " 差 " + (i+1) + "》\n" + fullBlock(r)).join("\n\n");
      if (g.skipped) out += "\n\n（" + pf + " 中間還有 " + g.skipped + " 篇深度資料沒列出來）";
    }
    const thin = (thinBy[pf] || []).slice(0, perThin);
    if (thin.length){
      out += "\n\n【" + pf + "｜列表資料 " + thin.length + " 筆，只有基本數字，依瀏覽數排序】\n" +
        thin.map(rowLine).join("\n");
    }
  });

  if (present.length > 1)
    out += "\n\n注意：不同平台的數字不能直接互相比較，觸及基準和演算法都不一樣。要比就在同一個平台內部比。";
  return out;
}

        r.items.forEach(x => all.push({
          platform: s.platform, title: x.t || "未命名", when: x.w || "",
          views: num(x.v), likes: num(x.l), comments: num(x.c), shares: num(x.s)
        }));
      } else failed++;
    } catch(e){ failed++; }
    await new Promise(r => setTimeout(r, 600));
  }
  const seen = {}, items = [];
  all.forEach(it => { const k = it.title + "|" + it.views; if (!seen[k]){ seen[k]=1; items.push(it); } });
  s.busy = "";
  if (!items.length){ s.err = "一則都沒讀到。列表截圖不要縮太小，數字要看得清楚。"; render(); return; }
  if (failed) s.err = "有 " + failed + " 張讀失敗，其餘已讀出。";
  s.draft = { mode:"list", platform: platform, date:new Date().toISOString().slice(0,10), items: items, dropped: all.length - items.length };
  render();
}

/* ==================== 開會 ==================== */
async function runMeeting(){
  const m = st.meet;
  if (!m.q.trim()){ m.err = "先寫下你想問的問題。"; render(); return; }
  m.err = ""; m.says = []; m.conv = "";
  const panel = ROLES.filter(r => st.roleKeys.includes(r.key));
  const ctx = brandBlock(st.brand) + "\n\n「已知數據」\n" + digest(st.insights, st.brand.digestCount) + "\n\n「老闆的問題」\n" + m.q;
  try {
    for (const r of panel){
      m.busy = r.name; render();
      const text = await callClaude(
        `你是「${st.brand.name}」顧問團的${r.name}。
職責：${r.job}
${FACT_RULE}
只講三到五點，每點一到兩句，各自獨立一行，開頭一定是【事實】或【推測】。
不要標題、不要編號、不要客套。講繁體中文（台灣用語）。`,
        [{ role:"user", content: ctx }], 1200);
      m.says.push({ role:r, lines: text.split("\n").map(x => x.trim()).filter(Boolean) });
      render();
    }
    m.busy = "收斂"; render();
    const merged = m.says.map(c => "【" + c.role.name + "】\n" + c.lines.join("\n")).join("\n\n");
    m.conv = await callClaude(
      `你是會議主席，把 ${panel.length} 位顧問的意見收斂。
${FACT_RULE}
只給 2 到 3 個方向，每個照這個結構，中間空一行：
方向一：一句話標題
為什麼：一句，開頭標【事實】或【推測】
先做什麼：一到三個動作，一行一個
怎麼知道有效：一個看得到的指標
不要開場白、不要總結段。講繁體中文。`,
      [{ role:"user", content: ctx + "\n\n「顧問們的意見」\n" + merged }], 1600);
    st.meetings = [{ id:Date.now(), at:new Date().toISOString(), q:m.q, says:m.says, conv:m.conv }].concat(st.meetings).slice(0,40);
    S.set("gf:meetings", st.meetings);
    m.busy = ""; render();
  } catch(e){ m.busy = ""; m.err = "開會中斷：" + e.message + "。已講完的還在下面，可以重按接著跑。"; render(); }
}

async function runDiag(){
  st.log.diag = []; st.log.diagBusy = true; render();
  const filler = "這是一段測試用的中文句子，用來確認長度會不會造成問題。".repeat(45);
  const probes = [
    { name:"1. 短文字", sys:"你是助理。", msg:"回覆 OK 兩個字。" },
    { name:"2. 短文字＋表情符號", sys:"你是助理。😍😍😍 ✨✨ 🎬🎬", msg:"回覆 OK 兩個字。" },
    { name:"3. 長文字", sys:"你是助理。" + filler, msg:"回覆 OK 兩個字。" },
    { name:"4. 帶入貼文範本", sys:"你是助理。範本：\n" + st.brand.sample, msg:"回覆 OK 兩個字。" },
    { name:"5. 要求輸出 JSON", sys:'你是助理。只輸出 JSON：{"a":"OK"}', msg:"照格式回覆。" }
  ];
  for (const p of probes){
    try { await callClaude(p.sys, [{ role:"user", content:p.msg }], 100, 1);
      st.log.diag.push({ name:p.name, ok:true, note:p.sys.length + " 字" }); }
    catch(e){ st.log.diag.push({ name:p.name, ok:false, note:p.sys.length + " 字 ｜ " + e.message }); }
    render();
    await new Promise(r => setTimeout(r, 700));
  }
  st.log.diagBusy = false; render();
}

function pctList(arr, top){
  if (!Array.isArray(arr) || !arr.length) return "";
  return arr.slice(0, top||99).map(x => esc(x.n) + " " + x.p + "%").join("、");
}
function detailBlock(r){
  const rows = [];
  if (r.platform || r.format) rows.push([r.platform, r.format].filter(Boolean).join(" ／ "));
  if (r.viewsIG !== undefined || r.viewsFB !== undefined)
    rows.push("觀看拆分：IG " + num(r.viewsIG) + "／FB " + num(r.viewsFB));
  if (r.likesIG !== undefined || r.likesFB !== undefined)
    rows.push("讚拆分：IG " + num(r.likesIG) + "／FB " + num(r.likesFB));
  if (r.profileVisits !== undefined && num(r.reach))
    rows.push("個人檔案點擊率 " + (num(r.profileVisits) / num(r.reach) * 100).toFixed(1) +
      "%（" + num(r.profileVisits) + " ／ 觸及 " + num(r.reach) + "）");
  if (r.fan !== undefined) rows.push("粉絲 " + r.fan + "%／非粉絲 " + (r.nonfan||0) + "%");
  const rates = [["分享率",r.rShare],["按讚率",r.rLike],["儲存率",r.rSave],["轉發率",r.rRepost],["留言率",r.rComment]]
    .filter(x => x[1] !== undefined).map(x => x[0] + " " + x[1] + "%");
  if (rates.length) rows.push(rates.join("、"));
  if (r.rateNote) rows.push(r.rateNote);
  if (r.avgWatch) rows.push("平均觀看 " + r.avgWatch + (r.vidLen ? "／全長 " + r.vidLen : ""));
  if (r.retention) rows.push("留存：" + r.retention);
  if (r.src) rows.push("來源：" + pctList(r.src, 5));
  if (r.ages) rows.push("年齡：" + pctList(r.ages, 7));
  if (r.male !== undefined) rows.push("男 " + r.male + "%／女 " + (r.female||0) + "%");
  if (r.geo) rows.push("地區：" + pctList(r.geo, 5));
  if (r.carousel) rows.push("輪播各張讚：" + r.carousel.map(x => esc(x.n) + " " + x.l).join("、"));
  if (r.collab) rows.push("共同協作：" + esc(r.collab));
  if (r.cross) rows.push(esc(r.cross));
  if (r.vsAvg) rows.push(esc(r.vsAvg));
  if (r.tags && r.tags.length) rows.push("hashtag：" + r.tags.map(t => "#" + esc(t)).join(" "));
  return rows.length ? '<div class="meta" style="margin-top:8px;line-height:1.9">' + rows.join("<br>") + '</div>' : "";
}

function metricTags(r){
  const f = [["瀏覽","views"],["觸及","reach"],["讚","likes"],["留言","comments"],
             ["轉發","reposts"],["分享","shares"],["儲存","saves"],
             ["個人檔案","profileVisits"],["新粉絲","newFollowers"]];
  return f.filter(([l,k]) => r[k] !== undefined && r[k] !== null)
    .map(([l,k]) => '<span class="mtag">' + l + ' <b>' + num(r[k]) + '</b></span>').join("");
}

        '<div style="height:8px"></div><textarea class="fi" data-g="pitch" data-i="' + i + '" rows="2" placeholder="賣點怎麼講">' + esc(g.pitch) + '</textarea>' +
        '<div style="height:8px"></div><div class="row"><input class="fi" style="width:96px" type="number" data-g="rate" data-i="' + i + '" value="' + Math.round((Number(g.rate)||0.2)*100) + '">' +
        '<span class="meta" style="align-self:center">% 的機率會寫到</span></div></div>';
    });
    h += '<div style="height:14px"></div><button class="btn" data-act="savebrand">' + (L.saved?'已儲存 ✓':'儲存設定') + '</button></div>';
  }

  if (L.open === "meet"){
    h += '<div class="card">' + (st.meetings.length ? st.meetings.map(m =>
      '<div class="rec"><div class="rec-t"><b>' + esc(m.q) + '</b><button class="rec-x" data-act="delmeet" data-id="' + m.id + '">刪除</button></div>' +
      '<div class="meta">' + new Date(m.at).toLocaleString("zh-TW") + '</div><p class="say" style="margin-top:8px">' + tagged(m.conv) + '</p></div>'
    ).join("") : '<div class="empty">還沒開過會。</div>') + '</div>';
  }

  if (L.open === "post"){
    h += '<div class="card">' + (st.posts.length ? st.posts.map(p =>
      '<div class="rec"><div class="rec-t"><b>' + esc(p.topic) + '</b><button class="rec-x" data-act="delpost" data-id="' + p.id + '">刪除</button></div>' +
      '<div class="meta">' + new Date(p.at).toLocaleString("zh-TW") + ' ｜ ' + esc(p.platform) + (p.ptype?' ｜ ' + esc(p.ptype):'') + '</div>' +
      '<div style="height:8px"></div><div class="post">' + esc(p.a) + '</div>' +
      '<div style="height:8px"></div><button class="btn ghost sm" data-act="copypost" data-id="' + p.id + '">複製</button></div>'
    ).join("") : '<div class="empty">還沒產過貼文。</div>') + '</div>';
  }

  if (L.open === "diag"){
    h += '<div class="card"><h3>連線診斷</h3><div class="meta" style="margin-bottom:12px">一項一項測，看哪一種請求會被打回來。</div>' +
      '<button class="btn" data-act="diag"' + (L.diagBusy?' disabled':'') + '>' + (L.diagBusy?'測試中…':'開始測試') + '</button>' +
      L.diag.map(r => '<div class="rec"><div class="rec-t"><b style="color:' + (r.ok?'var(--lime)':'var(--coral)') + '">' +
        (r.ok?'通過':'失敗') + '　' + esc(r.name) + '</b></div><div class="meta">' + esc(r.note) + '</div></div>').join("") + '</div>';
  }
  return h;
}

const TABS = [["post","✍️","產貼文"],["ins","📊","讀成效"],["meet","🧠","開會"],["log","📁","紀錄"]];

function render(){
  $("eyebrow").textContent = st.insights.length + " 筆數據在手";
  $("app").innerHTML = st.tab === "post" ? viewPost() : st.tab === "ins" ? viewIns() : st.tab === "meet" ? viewMeet() : viewLog();
  $("nav").innerHTML = TABS.map(([k,i,l]) =>
    '<button data-tab="' + k + '" class="' + (st.tab===k?'on':'') + '"><em>' + i + '</em>' + l + '</button>').join("");
  bind();
}

function bind(){
  const t = $("f-topic"); if (t) t.oninput = e => st.post.topic = e.target.value;
  const g = $("f-gist"); if (g) g.oninput = e => st.post.gist = e.target.value;
  const q = $("m-q"); if (q) q.oninput = e => st.meet.q = e.target.value;
  const dt = $("d-title"); if (dt) dt.oninput = e => st.ins.draft.title = e.target.value;
  const dd = $("d-date"); if (dd) dd.oninput = e => st.ins.draft.date = e.target.value;

  [["b-name","name"],["b-ig","ig"],["b-services","services"],["b-notes","notes"],["b-style","style"],["b-sample","sample"]].forEach(([id,key]) => {
    const el = $(id); if (el) el.oninput = e => { st.brand[key] = e.target.value; };
  });
  const bt = $("b-tag"); if (bt) bt.oninput = e => st.brand.tagCount = Number(e.target.value) || 5;
  const bd = $("b-digest"); if (bd) bd.oninput = e => st.brand.digestCount = Number(e.target.value) || 25;
  document.querySelectorAll("[data-g]").forEach(el => {
    el.oninput = e => {
      const i = Number(el.dataset.i), k = el.dataset.g;
      st.brand.gear[i][k] = k === "rate" ? (Number(e.target.value)||20)/100 : e.target.value;
    };
  });

  document.querySelectorAll("[data-tab]").forEach(el => el.onclick = () => { st.tab = el.dataset.tab; render(); });

  document.querySelectorAll("[data-act]").forEach(el => el.onclick = async () => {
    const a = el.dataset.act;
    if (a === "plat"){ st.post.platform = el.dataset.v; render(); }
    else if (a === "ptype"){ st.post.ptype = el.dataset.v; render(); }
    else if (a === "force"){ st.post.forceGear = !st.post.forceGear; render(); }
    else if (a === "ideas"){ runIdeas(); }
    else if (a === "useidea"){
      const it = st.post.ideas[Number(el.dataset.i)];
      st.post.topic = it.t; st.post.gist = it.o; st.post.ideas = []; render();
    }
    else if (a === "gen"){ runPost(); }
    else if (a === "rewrite"){ rewritePost(); }
    else if (a === "copy"){ copyText(st.post.out[el.dataset.k] + "\n" + st.post.out.hashtags); el.textContent = "已複製 ✓"; }
    else if (a === "copyconv"){ copyText(st.meet.conv); el.textContent = "已複製 ✓"; }
    else if (a === "pick"){ $("file-" + el.dataset.kind).click(); }
    else if (a === "unpick"){
      const k = el.dataset.kind, i = Number(el.dataset.i);
      if (k === "post") st.post.images.splice(i,1); else st.ins.images.splice(i,1);
      render();
    }
    else if (a === "insplat"){ st.ins.platform = el.dataset.v; st.ins.draft = null; st.ins.err = ""; render(); }
    else if (a === "insmode"){ st.ins.mode = el.dataset.v; st.ins.draft = null; st.ins.err = ""; render(); }
    else if (a === "readins"){ runInsight(); }
    else if (a === "saveins"){
      const d = st.ins.draft;
      const rows = d.items.map((it,i) => Object.assign({
        id: Date.now() + i, platform: d.platform, date: d.date
      }, it));
      st.insights = rows.concat(st.insights);
      S.set("gf:insights", st.insights);
      st.ins.draft = null; st.ins.images = []; render();
    }
    else if (a === "dropitem"){
      st.ins.draft.items.splice(Number(el.dataset.i), 1);
      if (!st.ins.draft.items.length) st.ins.draft = null;
      render();
    }
    else if (a === "dropins"){ st.ins.draft = null; render(); }
    else if (a === "delins"){
      st.insights = st.insights.filter(x => String(x.id) !== el.dataset.id);
      S.set("gf:insights", st.insights); render();
    }
    else if (a === "role"){
      const k = el.dataset.v;
      const next = st.roleKeys.includes(k) ? st.roleKeys.filter(x => x !== k) : st.roleKeys.concat([k]);
      if (next.length < 2){ st.meet.err = "至少要留兩個顧問。"; render(); return; }
      st.roleKeys = next; S.set("gf:roles", next); st.meet.err = ""; render();
    }
    else if (a === "meet"){ runMeeting(); }
    else if (a === "logtab"){ st.log.open = el.dataset.v; st.log.saved = false; render(); }
    else if (a === "savebrand"){
      S.set("gf:brand", st.brand); st.log.saved = true; render();
      setTimeout(() => { st.log.saved = false; if (st.tab === "log") render(); }, 1800);
    }
    else if (a === "delmeet"){
      st.meetings = st.meetings.filter(x => String(x.id) !== el.dataset.id);
      S.set("gf:meetings", st.meetings); render();
    }
    else if (a === "delpost"){
      st.posts = st.posts.filter(x => String(x.id) !== el.dataset.id);
      S.set("gf:posts", st.posts); render();
    }
    else if (a === "copypost"){
      const p = st.posts.find(x => String(x.id) === el.dataset.id);
      if (p) { copyText(p.a + "\n" + p.hashtags); el.textContent = "已複製 ✓"; }
    }
    else if (a === "diag"){ runDiag(); }
  });

  ["post","ins"].forEach(kind => {
    const inp = $("file-" + kind);
    if (!inp) return;
    inp.onchange = async e => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      const dim = kind === "ins" ? 1400 : 900;
      const qy = kind === "ins" ? 0.82 : 0.68;
      const max = kind === "ins" ? 12 : 3;
      for (const f of files){
        try {
          const b = await fileToBlock(f, dim, qy);
          const arr = kind === "post" ? st.post.images : st.ins.images;
          if (arr.length < max) arr.push(b);
        } catch(err){}
      }
      inp.value = "";
      render();
    };
  });
}

render();
</script>
</body>
</html>
